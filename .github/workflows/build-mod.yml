name: Build Minecraft Mod

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Gradle ausführbar machen
        run: chmod +x gradlew

      - name: Mod bauen
        run: ./gradlew build --no-daemon

      - name: Release-JAR auswählen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "Keine passende Mod-JAR in build/libs gefunden."
            exit 1
          fi
          if [ "${#jars[@]}" -gt 1 ]; then
            echo "Mehrere mögliche Mod-JARs gefunden:"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          echo "RELEASE_JAR_PATH=${jars[0]}" >> "$GITHUB_ENV"

      - name: GitHub Release erstellen oder aktualisieren
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag"
          else
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" "$RELEASE_JAR_PATH" --clobber

      - name: JAR als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: police-prison-mod-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
