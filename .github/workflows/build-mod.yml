name: Build Minecraft Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Gradle ausführbar machen
        run: chmod +x gradlew

      - name: Mod bauen
        run: ./gradlew build --no-daemon

      - name: JAR als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: police-prison-mod-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
